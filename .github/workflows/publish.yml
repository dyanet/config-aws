name: Publish Packages

# Stages any package whose package.json version is newer than what npm has
# and hasn't been staged yet (see determine-packages). Runs on v* tags and on
# every push to main, so merging a PR that bumps a package's version is what
# releases it; pushes that don't bump anything skip every publish job.
#
# Releases are *staged* through npm Trusted Publishing (OIDC; no token): the
# trusted publishers allow staging, not direct publishing, so nothing goes
# live until a maintainer approves it with 2FA at npmjs.com > Staged Packages
# (or `npm stage approve <stage-id>`). Approve @dyanet/config-aws before the
# adapters, since they depend on the new core version.
on:
  push:
    branches: [main]
    tags:
      - 'v*'

# Never run two publishes at once, and never cancel one mid-publish.
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  id-token: write   # npm Trusted Publishing (OIDC) and provenance
  contents: write   # to tag each staged package version

jobs:
  determine-packages:
    runs-on: ubuntu-latest
    outputs:
      config-aws: ${{ steps.check.outputs.config-aws }}
      nestjs-config-aws: ${{ steps.check.outputs.nestjs-config-aws }}
      nextjs-config-aws: ${{ steps.check.outputs.nextjs-config-aws }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check which packages need publishing
        id: check
        run: |
          # Compare semver versions: returns true if v1 > v2
          version_gt() {
            test "$(printf '%s\n' "$1" "$2" | sort -V | head -n1)" != "$1"
          }
          
          check_package() {
            local dir=$1
            local name=$2
            local output_key=$3
            
            local_version=$(node -p "require('./${dir}/package.json').version")
            
            # Get published version from npm (returns empty if not published)
            published_version=$(npm view "${name}" version 2>/dev/null || echo "")
            
            echo "Package: ${name}"
            echo "  Local version: ${local_version}"
            echo "  Published version: ${published_version:-none}"
            
            # npm stage list needs a logged-in user, so a staged-but-unapproved
            # version is recognised by the tag this workflow pushes after staging.
            if git ls-remote --exit-code --tags origin "refs/tags/${name}@${local_version}" >/dev/null; then
              echo "  -> ${name}@${local_version} already staged (tag exists); approve it on npmjs.com"
              echo "${output_key}=false" >> $GITHUB_OUTPUT
            elif [ -z "$published_version" ]; then
              echo "  -> Not yet published, needs publishing"
              echo "${output_key}=true" >> $GITHUB_OUTPUT
            elif version_gt "$local_version" "$published_version"; then
              echo "  -> Local version is higher, needs publishing"
              echo "${output_key}=true" >> $GITHUB_OUTPUT
            else
              echo "  -> Published version is same or higher, skipping"
              echo "${output_key}=false" >> $GITHUB_OUTPUT
            fi
          }
          
          check_package "packages/config-aws" "@dyanet/config-aws" "config-aws"
          check_package "packages/nestjs-config-aws" "@dyanet/nestjs-config-aws" "nestjs-config-aws"
          check_package "packages/nextjs-config-aws" "@dyanet/nextjs-config-aws" "nextjs-config-aws"

  publish-config-aws:
    needs: determine-packages
    if: needs.determine-packages.outputs.config-aws == 'true'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies (from root)
        run: npm ci

      - name: Build package
        run: npm run build --workspace=@dyanet/config-aws

      - name: Test package
        run: npm run test --workspace=@dyanet/config-aws

      - name: Update npm (`npm stage` needs a current npm)
        run: npm install -g npm@latest

      - name: Stage on npmjs with provenance (OIDC)
        working-directory: packages/config-aws
        run: |
          npm stage publish --provenance --access public
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "::notice title=Approve on npmjs::$NAME@$VERSION is staged. Approve it at npmjs.com > Staged Packages (2FA), or run: npm stage approve <stage-id>"

      - name: Tag the staged version
        working-directory: packages/config-aws
        run: |
          TAG="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  publish-nestjs-config-aws:
    needs: [determine-packages, publish-config-aws]
    if: |
      always() &&
      needs.determine-packages.outputs.nestjs-config-aws == 'true' &&
      (needs.publish-config-aws.result == 'success' || needs.publish-config-aws.result == 'skipped')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies (from root)
        run: npm ci

      - name: Build config-aws (workspace dependency)
        run: npm run build --workspace=@dyanet/config-aws

      - name: Build package
        run: npm run build --workspace=@dyanet/nestjs-config-aws

      - name: Test package
        run: npm run test --workspace=@dyanet/nestjs-config-aws

      - name: Update npm (`npm stage` needs a current npm)
        run: npm install -g npm@latest

      - name: Stage on npmjs with provenance (OIDC)
        working-directory: packages/nestjs-config-aws
        run: |
          npm stage publish --provenance --access public
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "::notice title=Approve on npmjs::$NAME@$VERSION is staged. Approve it at npmjs.com > Staged Packages (2FA), or run: npm stage approve <stage-id>"

      - name: Tag the staged version
        working-directory: packages/nestjs-config-aws
        run: |
          TAG="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"

  publish-nextjs-config-aws:
    needs: [determine-packages, publish-config-aws]
    if: |
      always() &&
      needs.determine-packages.outputs.nextjs-config-aws == 'true' &&
      (needs.publish-config-aws.result == 'success' || needs.publish-config-aws.result == 'skipped')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies (from root)
        run: npm ci

      - name: Build config-aws (workspace dependency)
        run: npm run build --workspace=@dyanet/config-aws

      - name: Build package
        run: npm run build --workspace=@dyanet/nextjs-config-aws

      - name: Test package
        run: npm run test --workspace=@dyanet/nextjs-config-aws

      - name: Update npm (`npm stage` needs a current npm)
        run: npm install -g npm@latest

      - name: Stage on npmjs with provenance (OIDC)
        working-directory: packages/nextjs-config-aws
        run: |
          npm stage publish --provenance --access public
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "::notice title=Approve on npmjs::$NAME@$VERSION is staged. Approve it at npmjs.com > Staged Packages (2FA), or run: npm stage approve <stage-id>"

      - name: Tag the staged version
        working-directory: packages/nextjs-config-aws
        run: |
          TAG="$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
